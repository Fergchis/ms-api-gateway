server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          use-framework-retry-filter: true
          routes:
            - id: ms-gestion-academica
              uri: ${GESTION_ACADEMICA_URI:http://localhost:8081}
              predicates:
                - Path=/api/alumnos/**,/api/alumnosCurso/**,/api/asignaturas/**,/api/cargas-academicas/**,/api/cursos/**,/api/evaluaciones/**,/api/notas/**,/api/usuarios/**
              filters:
                - Retry=2
            - id: ms-asistencia
              uri: ${ASISTENCIA_URI:http://localhost:3000}
              predicates:
                - Path=/api/asistencias/**,/api/justificativos/**,/api/anotaciones/**,/api/mensaje/**
              filters:
                - Retry=2

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
